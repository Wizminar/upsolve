<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upsolve</title>
  <meta name="description" content="Codeforces practice problems picked from your own submission history.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="wordmark" href="/" aria-label="Upsolve home">
      <svg class="wordmark-mark" viewBox="0 0 20 28" aria-hidden="true">
        <rect x="0" y="0"  width="20" height="4" fill="var(--r-gm)"/>
        <rect x="0" y="5"  width="20" height="4" fill="var(--r-master)"/>
        <rect x="0" y="10" width="20" height="4" fill="var(--r-cm)"/>
        <rect x="0" y="15" width="20" height="4" fill="var(--r-expert)"/>
        <rect x="0" y="20" width="20" height="4" fill="var(--r-specialist)"/>
        <rect x="0" y="25" width="20" height="3" fill="var(--r-pupil)"/>
      </svg>
      Upsolve
    </a>
    <form class="handle-form" id="handle-form" role="search" aria-label="Load a Codeforces handle">
      <label for="handle-input" class="visually-hidden">Codeforces handle</label>
      <input id="handle-input" name="handle" autocomplete="off" spellcheck="false" placeholder="Codeforces handle"
             pattern="[A-Za-z0-9_.\-]{3,24}" required>
      <button type="submit" class="btn btn-ink">Sync</button>
    </form>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main id="main" tabindex="-1"></main>

  <footer class="colophon">
    <p>Problem data from the <a href="https://codeforces.com/apiHelp">Codeforces API</a>.
      Estimates are probabilities, not promises.</p>
    <ul class="colophon-links">
      <li><a href="/api/docs">API docs</a></li>
      <li><a id="text-link" href="/">Text-only view</a></li>
    </ul>
  </footer>

  <noscript>
    <p class="noscript">This app needs JavaScript. A script-free summary is available at <code>/text/&lt;handle&gt;</code>.</p>
  </noscript>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
